name: train

on:
  workflow_dispatch: {}
  schedule:
    # Weekly, not every 30 minutes -- retraining on a schedule is a
    # reasonable default cadence, but promotion still depends entirely on
    # beating the current champion (guia metodologica p.11). Trigger
    # manually instead whenever monitor.py raises a drift signal.
    - cron: "0 6 * * 1"

env:
  PYTHONPATH: src

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Train candidate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python src/train.py

      - name: Commit new model artifact (if any)
        run: |
          git config user.name "pulso-transmi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/models/
          if ! git diff --cached --quiet; then
            git commit -m "train: new model artifact from scheduled/manual run"
            # Retry with rebase on a push race -- see train-on-drift.yml for
            # why this matters: train.py already promoted in Supabase by
            # this point, so a lost push race leaves the champion pointing
            # at an artifact that was never committed.
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              echo "push rejected, retrying with rebase (attempt $i)"
              git fetch origin main
              git rebase origin/main
              sleep $((i * 3))
            done
          else
            echo "no new artifact to commit"
          fi
