name: pipeline

on:
  schedule:
    # Redundant triggers -- GitHub's free-tier cron still doesn't fire
    # reliably at 10-minute granularity (confirmed: most 10-minute slots
    # never actually ran). This is just a backup fuse now: each run that
    # DOES fire polls for up to 50 minutes (src/watch_and_submit.py), which
    # alone covers most of any given hour, so getting a trigger every 10
    # minutes is no longer load-bearing -- it only needs to fire once in a
    # while to keep the relay going.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

env:
  PYTHONPATH: src

concurrency:
  # Queue instead of cancel: if a run is mid-poll when the next trigger
  # fires, let it finish its 50-minute window and have the new one start
  # right after, so coverage chains continuously instead of a fresh trigger
  # killing a run that might be seconds from catching an open cycle.
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Watch for the open cycle and submit (collector + predict, polling)
        env:
          PTM_API_KEY: ${{ secrets.PTM_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python src/watch_and_submit.py
