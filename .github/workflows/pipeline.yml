name: pipeline

on:
  schedule:
    # Every 10 minutes, not just minute 07/37. GitHub's free-tier cron
    # silently drops or delays scheduled runs under load -- in the first 47h
    # of this pipeline only 12 of ~94 expected half-hourly triggers actually
    # fired. A tighter schedule raises the odds that *some* trigger survives
    # inside any given hour; each run that does fire then polls for up to
    # 12 minutes (src/watch_and_submit.py) instead of checking once and
    # giving up, so it doesn't need to land on an exact minute either.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

env:
  PYTHONPATH: src

concurrency:
  # If a previous run is still polling when a new one fires, let the new one
  # take over instead of piling up parallel runners against the same cycle.
  group: pipeline
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Watch for the open cycle and submit (collector + predict, polling)
        env:
          PTM_API_KEY: ${{ secrets.PTM_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python src/watch_and_submit.py
