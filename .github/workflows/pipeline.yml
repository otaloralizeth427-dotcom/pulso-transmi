name: pipeline

on:
  schedule:
    # Backup fuse -- the real continuity mechanism is the self-retrigger
    # step at the end of this job (each run launches the next one itself),
    # explicitly authorized by the user via a Bash permission rule after
    # GitHub's free-tier cron repeatedly failed to fire reliably even at
    # 10-minute granularity (confirmed: multi-hour gaps with nothing
    # watching). This schedule only exists to restart the chain if it ever
    # dies (e.g. a run fails before reaching the retrigger step).
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write  # needed to trigger the next run of this same workflow

env:
  PYTHONPATH: src

concurrency:
  # Queue instead of cancel: if a scheduled trigger fires while a run is
  # mid-poll (or while its self-triggered successor is starting), let it
  # queue instead of killing a run that might be seconds from catching an
  # open cycle.
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Watch for the open cycle and submit (collector + predict, polling)
        env:
          PTM_API_KEY: ${{ secrets.PTM_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python src/watch_and_submit.py

      - name: Relay to the next run
        if: always()  # keep the chain alive even if the watch step above failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pipeline --repo ${{ github.repository }}
