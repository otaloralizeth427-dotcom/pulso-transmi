name: pipeline

on:
  schedule:
    # GitHub's free-tier cron does not fire reliably at this granularity
    # (confirmed repeatedly: most 10-minute slots simply never ran, some
    # gaps over 2 hours). Each run that does fire polls for up to 50 minutes
    # (src/watch_and_submit.py) rather than checking once, which covers
    # most of an hour on its own -- but there is no fully cron-independent
    # fix within free-tier GitHub Actions without a self-retriggering
    # workflow, which was intentionally not added here (flagged as an
    # unauthorized-persistence pattern -- a workflow that keeps re-launching
    # itself indefinitely). Until/unless the user explicitly authorizes
    # that, gaps between runs are mitigated, not eliminated: expect to
    # occasionally need a manual `gh workflow run pipeline` to bridge one.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

env:
  PYTHONPATH: src

concurrency:
  # Queue instead of cancel: if a scheduled trigger fires while a run is
  # mid-poll (or while its self-triggered successor is starting), let it
  # queue instead of killing a run that might be seconds from catching an
  # open cycle.
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Watch for the open cycle and submit (collector + predict, polling)
        env:
          PTM_API_KEY: ${{ secrets.PTM_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python src/watch_and_submit.py
